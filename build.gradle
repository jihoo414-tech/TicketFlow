plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'First-come concert booking service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('installFrontend', Exec) {
	workingDir 'frontend'
	commandLine npm, 'ci'
	inputs.file 'frontend/package-lock.json'
	outputs.dir 'frontend/node_modules'
}

tasks.register('buildFrontend', Exec) {
	dependsOn 'installFrontend'
	workingDir 'frontend'
	commandLine npm, 'run', 'build'
	inputs.dir 'frontend/src'
	inputs.files 'frontend/index.html', 'frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/tsconfig.json'
	outputs.dir 'src/main/resources/static'
}

tasks.named('processResources') {
	mustRunAfter 'buildFrontend'
}

tasks.named('bootRun') {
	dependsOn 'buildFrontend'
}

tasks.named('bootJar') {
	dependsOn 'buildFrontend'
}
