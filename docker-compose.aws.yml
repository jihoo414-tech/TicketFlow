name: ticketflow-aws

services:
  mysql:
    image: mysql:8.4
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    command: --innodb-buffer-pool-size=768M --max-connections=66

    ports:
      - "${AWS_MYSQL_PORT:-3316}:3306"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  app:
    build: .
    cpus: 2
    mem_limit: 850m
    memswap_limit: 850m

    ports:
      - "${AWS_APP_PORT:-8081}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: perf
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: -Xmx512m

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
