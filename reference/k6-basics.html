<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="stylesheet" href="../assets/lesson.css"><title>k6 빠른 참고</title><main><h1>k6 빠른 참고</h1><div class="card"><p><b>VU:</b> 가상 회원 역할을 하는 실행자.</p><p><b>duration:</b> 테스트를 반복하는 시간.</p><p><b>http_req_duration p(95):</b> 요청 95%의 응답 시간이 이 값 이하라는 뜻.</p><p><b>http_req_failed:</b> k6가 실패로 분류한 HTTP 요청의 비율.</p><p><b>check:</b> 정해진 조건을 확인하는 것. check 실패만으로 실행 전체가 자동 실패하지는 않는다.</p><p><b>threshold:</b> 테스트 전체가 통과할 기준.</p><a href="../lessons/0001-first-load-test.html">첫 수업으로 돌아가기</a></div></main></html>
