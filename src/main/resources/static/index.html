<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow</title>
    <style>
        body {
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .performance {
            cursor: pointer;
        }
        .performance.selected {
            border-color: #333;
        }
        .message {
            color: #666;
        }
        .showtime {
            cursor: pointer;
        }
        .showtime.selected {
            border-color: #333;
        }
        .stage {
            text-align: center;
            padding: 4px;
            margin-bottom: 16px;
            background: #eee;
            border-radius: 4px;
            color: #666;
        }
        .seat-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .seat-row-label {
            width: 24px;
            font-weight: bold;
        }
        .seat {
            width: 32px;
            height: 32px;
            border: 1px solid #999;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .member-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
        }
        .seat.available {
            background: #e6f4ea;
            border-color: #4caf50;
            cursor: pointer;
        }
        .seat.available.selected {
            background: #4caf50;
            color: #fff;
        }
        .seat.held {
            background: #eee;
            border-color: #ccc;
            color: #aaa;
            cursor: not-allowed;
        }
        .seat-legend {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        .seat-legend .seat {
            width: 16px;
            height: 16px;
            cursor: default;
        }
        .hold-result {
            padding: 12px 16px;
            border: 1px solid #4caf50;
            border-radius: 8px;
        }
        .error {
            color: #c62828;
        }
    </style>
</head>
<body>
<header class="member-bar">
    <label for="member-select">회원</label>
    <select id="member-select" disabled>
        <option value="">불러오는 중...</option>
    </select>
</header>

<h1>공연 목록</h1>
<p id="message" class="message">불러오는 중...</p>
<ul id="performances"></ul>

<section id="showtime-section" hidden>
    <h2 id="showtime-title"></h2>
    <p id="showtime-message" class="message"></p>
    <ul id="showtimes"></ul>
</section>

<section id="seat-section" hidden>
    <h2 id="seat-title"></h2>
    <p id="seat-message" class="message"></p>
    <div id="seat-map" hidden>
        <div class="stage">무대</div>
        <div id="seat-rows"></div>
        <p class="seat-legend">
            <span class="seat available"></span>선택 가능
            <span class="seat held"></span>선점됨
        </p>
        <p id="seat-price"></p>
        <p id="selected-seats" class="message">선택한 좌석이 없습니다.</p>
        <button id="hold-button" type="button" disabled>선점하기</button>
        <p id="hold-message" class="message"></p>
        <div id="hold-result" class="hold-result" hidden></div>
    </div>
</section>

<script>
    const memberSelect = document.getElementById('member-select');
    const message = document.getElementById('message');
    const list = document.getElementById('performances');
    const showtimeSection = document.getElementById('showtime-section');
    const showtimeTitle = document.getElementById('showtime-title');
    const showtimeMessage = document.getElementById('showtime-message');
    const showtimeList = document.getElementById('showtimes');
    const seatSection = document.getElementById('seat-section');
    const seatTitle = document.getElementById('seat-title');
    const seatMessage = document.getElementById('seat-message');
    const seatMap = document.getElementById('seat-map');
    const seatRows = document.getElementById('seat-rows');
    const seatPrice = document.getElementById('seat-price');
    const selectedSeatsText = document.getElementById('selected-seats');
    const holdButton = document.getElementById('hold-button');
    const holdMessage = document.getElementById('hold-message');
    const holdResult = document.getElementById('hold-result');

    let currentShowtime = null;
    let holdTimer = null;
    const selectedSeats = new Map();

    const SEAT_STATUS_CLASS = {
        AVAILABLE: 'available',
        HELD: 'held'
    };

    function formatDateTime(value) {
        return value.slice(0, 16).replace('T', ' ');
    }

    function apiFetch(url, options = {}) {
        const headers = new Headers(options.headers);
        if (memberSelect.value) {
            headers.set('X-Member-Id', memberSelect.value);
        }
        return fetch(url, { ...options, headers });
    }

    async function loadMembers() {
        try {
            const response = await fetch('/api/members');
            if (!response.ok) {
                throw new Error(response.status);
            }
            const members = await response.json();

            memberSelect.replaceChildren();
            if (members.length === 0) {
                memberSelect.appendChild(new Option('회원 없음', ''));
                return;
            }

            for (const member of members) {
                memberSelect.appendChild(new Option(member.name, member.id));
            }
            memberSelect.disabled = false;
        } catch (error) {
            memberSelect.replaceChildren(new Option('불러오기 실패', ''));
        }
    }

    async function loadPerformances() {
        try {
            const response = await apiFetch('/api/performances');
            if (!response.ok) {
                throw new Error(response.status);
            }
            const performances = await response.json();

            if (performances.length === 0) {
                message.textContent = '등록된 공연이 없습니다.';
                return;
            }

            message.hidden = true;
            for (const performance of performances) {
                const item = document.createElement('li');
                item.className = 'performance';
                item.textContent = performance.title;
                item.addEventListener('click', () => selectPerformance(item, performance));
                list.appendChild(item);
            }
        } catch (error) {
            message.textContent = '공연 목록을 불러오지 못했습니다.';
        }
    }

    function selectPerformance(item, performance) {
        for (const other of list.children) {
            other.classList.remove('selected');
        }
        item.classList.add('selected');
        loadShowtimes(performance);
    }

    async function loadShowtimes(performance) {
        showtimeSection.hidden = false;
        showtimeTitle.textContent = performance.title + ' 회차';
        showtimeMessage.hidden = false;
        showtimeMessage.textContent = '불러오는 중...';
        showtimeList.replaceChildren();
        seatSection.hidden = true;

        try {
            const response = await apiFetch(`/api/performances/${performance.id}/showtimes`);
            if (response.status === 404) {
                showtimeMessage.textContent = '존재하지 않는 공연입니다.';
                return;
            }
            if (!response.ok) {
                throw new Error(response.status);
            }
            const showtimes = await response.json();

            if (showtimes.length === 0) {
                showtimeMessage.textContent = '예정된 회차가 없습니다.';
                return;
            }

            showtimeMessage.hidden = true;
            for (const showtime of showtimes) {
                const item = document.createElement('li');
                item.className = 'showtime';
                item.addEventListener('click', () => selectShowtime(item, showtime));
                item.textContent = `${formatDateTime(showtime.startsAt)} · `
                    + `${showtime.price.toLocaleString('ko-KR')}원 · `
                    + `예매 오픈 ${formatDateTime(showtime.bookingOpenAt)}`;
                showtimeList.appendChild(item);
            }
        } catch (error) {
            showtimeMessage.textContent = '회차 목록을 불러오지 못했습니다.';
        }
    }

    function selectShowtime(item, showtime) {
        for (const other of showtimeList.children) {
            other.classList.remove('selected');
        }
        item.classList.add('selected');
        loadSeats(showtime);
    }

    async function loadSeats(showtime) {
        seatSection.hidden = false;
        seatTitle.textContent = formatDateTime(showtime.startsAt) + ' 좌석';
        seatMessage.hidden = false;
        seatMessage.textContent = '불러오는 중...';
        seatMap.hidden = true;
        currentShowtime = showtime;
        resetHoldForm();
        clearHoldResult();
        await reloadSeatMap();
    }

    async function reloadSeatMap() {
        const showtime = currentShowtime;
        try {
            const response = await apiFetch(`/api/showtimes/${showtime.id}/seats`);
            if (showtime !== currentShowtime) {
                return;
            }
            if (response.status === 404) {
                seatMessage.textContent = '존재하지 않는 회차입니다.';
                return;
            }
            if (!response.ok) {
                throw new Error(response.status);
            }
            const seats = await response.json();

            if (seats.length === 0) {
                seatMessage.textContent = '등록된 좌석이 없습니다.';
                return;
            }

            seatMessage.hidden = true;
            clearSelection();
            seatRows.replaceChildren();
            renderSeatMap(seats);
            seatMap.hidden = false;
        } catch (error) {
            seatMessage.hidden = false;
            seatMessage.textContent = '좌석 배치도를 불러오지 못했습니다.';
        }
    }

    function renderSeatMap(seats) {
        const rows = Map.groupBy(seats, seat => seat.row);
        for (const [row, rowSeats] of rows) {
            const rowElement = document.createElement('div');
            rowElement.className = 'seat-row';

            const label = document.createElement('span');
            label.className = 'seat-row-label';
            label.textContent = row;
            rowElement.appendChild(label);

            for (const seat of rowSeats) {
                const seatElement = document.createElement('span');
                seatElement.className = 'seat ' + (SEAT_STATUS_CLASS[seat.status] ?? '');
                seatElement.textContent = seat.number;
                seatElement.title = `${seat.row}열 ${seat.number}번 · ${seat.price.toLocaleString('ko-KR')}원`;
                if (seat.status === 'AVAILABLE') {
                    seatElement.addEventListener('click', () => toggleSeat(seatElement, seat));
                }
                rowElement.appendChild(seatElement);
            }
            seatRows.appendChild(rowElement);
        }

        const prices = [...new Set(seats.map(seat => seat.price))];
        seatPrice.textContent = '가격: ' + prices.map(price => price.toLocaleString('ko-KR') + '원').join(', ');
    }

    function formatSeat(seat) {
        return `${seat.row}${seat.number}`;
    }

    function toggleSeat(seatElement, seat) {
        if (selectedSeats.has(seat.id)) {
            selectedSeats.delete(seat.id);
            seatElement.classList.remove('selected');
        } else {
            selectedSeats.set(seat.id, { seat, element: seatElement });
            seatElement.classList.add('selected');
        }
        renderSelectedSeats();
    }

    function renderSelectedSeats() {
        const seats = [...selectedSeats.values()].map(selected => selected.seat);
        selectedSeatsText.textContent = seats.length === 0
            ? '선택한 좌석이 없습니다.'
            : '선택한 좌석: ' + seats.map(formatSeat).join(', ');
        holdButton.disabled = seats.length === 0;
    }

    function clearSelection() {
        for (const selected of selectedSeats.values()) {
            selected.element.classList.remove('selected');
        }
        selectedSeats.clear();
        renderSelectedSeats();
    }

    function resetHoldForm() {
        clearSelection();
        holdMessage.textContent = '';
        holdMessage.classList.remove('error');
    }

    async function holdSeats() {
        holdButton.disabled = true;
        holdMessage.classList.remove('error');
        holdMessage.textContent = '선점 요청 중...';

        try {
            const response = await apiFetch(`/api/showtimes/${currentShowtime.id}/holds`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seatIds: [...selectedSeats.keys()] })
            });
            const body = await response.json();
            if (!response.ok) {
                if (body.code === 'SEAT_ALREADY_HELD') {
                    await reloadSeatMap();
                }
                showHoldError(body.detail ?? `선점에 실패했습니다. (${response.status})`);
                return;
            }

            resetHoldForm();
            renderHoldResult(body);
            await reloadSeatMap();
        } catch (error) {
            showHoldError('선점 요청을 보내지 못했습니다.');
        }
    }

    function showHoldError(text) {
        holdMessage.classList.add('error');
        holdMessage.textContent = text;
        holdButton.disabled = selectedSeats.size === 0;
    }

    function renderHoldResult(hold) {
        clearHoldResult();
        const remainingLine = createLine('');
        holdResult.replaceChildren(
            createLine(`선점 #${hold.id} 성공`),
            createLine('좌석: ' + hold.seats.map(formatSeat).join(', ')),
            createLine('만료: ' + hold.expiresAt.slice(0, 19).replace('T', ' ')),
            remainingLine
        );
        holdResult.hidden = false;
        startHoldTimer(new Date(hold.expiresAt.slice(0, 19)), remainingLine);
    }

    function startHoldTimer(expiresAt, remainingLine) {
        const tick = () => {
            const remainingMs = expiresAt - Date.now();
            if (remainingMs <= 0) {
                stopHoldTimer();
                remainingLine.textContent = '선점이 만료되었습니다.';
                reloadSeatMap();
                return;
            }
            remainingLine.textContent = '남은 시간: ' + formatRemaining(remainingMs);
        };
        tick();
        holdTimer = setInterval(tick, 1000);
    }

    function formatRemaining(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
    }

    function stopHoldTimer() {
        clearInterval(holdTimer);
        holdTimer = null;
    }

    function clearHoldResult() {
        stopHoldTimer();
        holdResult.hidden = true;
    }

    function createLine(text) {
        const line = document.createElement('p');
        line.textContent = text;
        return line;
    }

    holdButton.addEventListener('click', holdSeats);

    loadMembers();
    loadPerformances();
</script>
</body>
</html>
