<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow</title>
    <style>
        body {
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .message {
            color: #666;
        }
    </style>
</head>
<body>
<h1>공연 목록</h1>
<p id="message" class="message">불러오는 중...</p>
<ul id="performances"></ul>

<script>
    const message = document.getElementById('message');
    const list = document.getElementById('performances');

    async function loadPerformances() {
        try {
            const response = await fetch('/api/performances');
            if (!response.ok) {
                throw new Error(response.status);
            }
            const performances = await response.json();

            if (performances.length === 0) {
                message.textContent = '등록된 공연이 없습니다.';
                return;
            }

            message.hidden = true;
            for (const performance of performances) {
                const item = document.createElement('li');
                item.textContent = performance.title;
                list.appendChild(item);
            }
        } catch (error) {
            message.textContent = '공연 목록을 불러오지 못했습니다.';
        }
    }

    loadPerformances();
</script>
</body>
</html>
