server:
  tomcat:
    accesslog:
      enabled: true
      directory: /tmp/access-log
      prefix: access
      suffix: .log
      file-date-format: ''
      rotate: false
      buffered: false
      pattern: '%{begin:msec}t %m %U %s %{us}T'

spring:
  sql:
    init:
      mode: never
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.orm.query.hql: 'OFF'

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
