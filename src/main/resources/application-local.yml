spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.query.hql: trace
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:local-only-jwt-secret-do-not-use-elsewhere}

entry-pass:
  secret: ${ENTRY_PASS_SECRET:local-only-entry-pass-secret-do-not-use-elsewhere}

queue:
  internal-secret: ${QUEUE_INTERNAL_SECRET:local-only-internal-secret}
