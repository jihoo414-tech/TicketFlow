spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 1h

entry-pass:
  secret: ${ENTRY_PASS_SECRET}

queue:
  internal-secret: ${QUEUE_INTERNAL_SECRET}

queue-server:
  url: ${QUEUE_SERVER_URL:http://localhost:8081}
